name: first-cicd
'on': push

jobs:
  build:
    name: docker build for k8s
    runs-on: ubuntu-latest 
    outputs:
        image_tag: ${{ steps.get_tag.outputs.image_tag }}
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: docker login
          run: |
           docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}

        - name: push docker image to docker on
          id: get_tag
          run: |
           IMAGE_TAG=${{ github.sha }}
           IMAGE_NAME=nanup/k8s-data:$IMAGE_TAG
           docker build -t $IMAGE_NAME .
           docker push $IMAGE_NAME
           echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
           echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
           echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
  
  deploy:
    name: helm chart update
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Update kustomization image
        run: |
          sed -i "s/k8s-data:.*/k8s-data:${GITHUB_SHA}/g" demo-app/values.yaml
      - name: Commit changes
        run: |
          git config user.name "anupnandeda5759"
          git config user.email "anupnandeda@gmail.com"
          git add demo-app/values.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push